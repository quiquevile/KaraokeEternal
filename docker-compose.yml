services:
  karaoke-eternal:
    build:
      context: .
      dockerfile: Dockerfile
    image: karaoke-eternal:local
    container_name: karaoke-eternal
    ports:
      - '8080:8080'
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - KES_PORT=8080
      - KES_PATH_DATA=/config
      - KES_YTDL_BIN=/config/bin/yt-dlp
    volumes:
      - ./config:/config
      - ./karaoke:/mnt/karaoke
    restart: unless-stopped